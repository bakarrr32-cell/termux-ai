<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0b0f">
<title>Termux AI</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: #0b0b0f;
  color: #f5f5f5;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
}

body {
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

header {
  display: flex;
  align-items: center;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 16px;
  font-weight: 650;
}

.online {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #22c55e;
  box-shadow: 0 0 10px rgba(34, 197, 94, 0.45);
}


.theme-toggle {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: #f5f5f5;
  color: #101014;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 17px;
  cursor: pointer;
  border: 1px solid rgba(255,255,255,0.18);
  transition: background 0.2s ease, color 0.2s ease, transform 0.15s ease;
}

.theme-toggle:active {
  transform: scale(0.9);
}

html.light,
html.light body {
  background: #ffffff;
  color: #111111;
}

html.light .header-button {
  color: #555555;
}

html.light .theme-toggle {
  background: #111111;
  color: #ffffff;
  border-color: rgba(0,0,0,0.12);
}

html.light .message.ai {
  color: #222222;
}

html.light .message.user span {
  background: #eeeeee;
  color: #111111;
}

html.light .label {
  color: #777777;
}

html.light .welcome p {
  color: #666666;
}

html.light .logo {
  background: #111111;
  color: #ffffff;
  box-shadow: 0 15px 45px rgba(0,0,0,0.08);
}

html.light #chat::-webkit-scrollbar-thumb {
  background: #cccccc;
}

.header-button {
  width: 36px;
  height: 36px;
  border: 0;
  border-radius: 10px;
  background: transparent;
  color: #aaa;
  font-size: 20px;
}

#chat {
  flex: 1;
  overflow-y: auto;
  padding: 28px 15px 125px;
}

#chat::-webkit-scrollbar {
  width: 4px;
}

#chat::-webkit-scrollbar-thumb {
  background: #292930;
  border-radius: 10px;
}

.chat-inner {
  width: 100%;
  max-width: 820px;
  margin: auto;
}

.welcome {
  min-height: 58vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 20px;
}

.logo {
  width: 62px;
  height: 62px;
  border-radius: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #f5f5f5;
  color: #101014;
  font-size: 23px;
  font-weight: 800;
  box-shadow: 0 15px 45px rgba(255,255,255,0.08);
  margin-bottom: 20px;
}

.welcome h1 {
  margin: 0;
  font-size: 27px;
  letter-spacing: -0.7px;
}

.welcome p {
  margin: 9px 0 0;
  color: #888893;
  font-size: 14px;
}

.message {
  display: flex;
  margin: 23px 0;
  animation: appear 0.18s ease;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(5px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.message.user {
  justify-content: flex-end;
}

.message.ai {
  justify-content: flex-start;
}

.message > div {
  max-width: 84%;
}

.label {
  margin-bottom: 6px;
  color: #777782;
  font-size: 11px;
}

.message.user .label {
  text-align: right;
}

.message.user span {
  display: inline-block;
  padding: 12px 16px;
  background: #252a34;
  border-radius: 18px 18px 5px 18px;
  font-size: 15px;
  line-height: 1.5;
  white-space: pre-wrap;
  word-break: break-word;
}

.message.ai {
  color: #ededf0;
  font-size: 15px;
  line-height: 1.65;
  word-break: break-word;
}

.typing {
  display: inline-flex;
  gap: 5px;
  align-items: center;
  padding: 8px 0;
}

.typing span {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #888;
  animation: typing 1.2s infinite;
}

.typing span:nth-child(2) {
  animation-delay: 0.15s;
}

.typing span:nth-child(3) {
  animation-delay: 0.3s;
}

@keyframes typing {
  0%, 60%, 100% {
    opacity: 0.3;
    transform: translateY(0);
  }

  30% {
    opacity: 1;
    transform: translateY(-4px);
  }
}

.input-area {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 10px 13px 14px;
  background: linear-gradient(to top, #0b0b0f 65%, transparent);
}

.input-box {
  max-width: 820px;
  margin: auto;
  display: flex;
  align-items: flex-end;
  flex-wrap: wrap;
  gap: 8px;
  padding: 8px;
  background: #17171d;
  border: 1px solid #33333c;
  border-radius: 17px;
  box-shadow: 0 10px 35px rgba(0,0,0,0.3);
}

.attachment-row { width: 100%; display: none; gap: 8px; padding: 8px 10px 0; overflow-x: auto; }
.attachment-row.visible { display: flex; }
.attachment { position: relative; flex: 0 0 auto; width: 58px; height: 58px; border-radius: 10px; overflow: hidden; border: 1px solid #33333c; background: #17171c; }
.attachment img { width: 100%; height: 100%; object-fit: cover; display: block; }
.attachment button { position: absolute; right: 2px; top: 2px; width: 20px; height: 20px; border: 0; border-radius: 50%; background: rgba(0,0,0,.75); color: #fff; cursor: pointer; }
#attach { width: 40px; height: 40px; flex-shrink: 0; border: 0; border-radius: 12px; background: #24242b; color: #ddd; font-size: 20px; cursor: pointer; }
#image-input { display: none; }
.message.user .message-images { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.message.user .message-images img { max-width: 180px; max-height: 180px; border-radius: 12px; object-fit: cover; }

textarea {
  flex: 1;
  min-width: 0;
  resize: none;
  border: 0;
  outline: 0;
  background: transparent;
  color: #fff;
  font-family: inherit;
  font-size: 15px;
  line-height: 1.45;
  padding: 9px;
}

textarea::placeholder {
  color: #777782;
}

#send {
  width: 40px;
  height: 40px;
  flex-shrink: 0;
  border: 0;
  border-radius: 12px;
  background: #f5f5f5;
  color: #111;
  font-size: 21px;
  cursor: pointer;
  transition: transform 0.15s ease;
}

#send:active {
  transform: scale(0.92);
}

#send:disabled {
  opacity: 0.4;
}

.markdown {
  white-space: normal;
}

.markdown h1,
.markdown h2,
.markdown h3 {
  line-height: 1.3;
  margin: 18px 0 10px;
}

.markdown h1 {
  font-size: 24px;
}

.markdown h2 {
  font-size: 20px;
}

.markdown h3 {
  font-size: 17px;
}

.markdown p {
  margin: 10px 0;
}

.markdown ul,
.markdown ol {
  padding-left: 25px;
  margin: 10px 0;
}

.markdown li {
  margin: 5px 0;
}

.inline-code {
  background: #202027;
  border: 1px solid #303039;
  border-radius: 5px;
  padding: 2px 6px;
  font-family: monospace;
  font-size: 0.9em;
}

.code-block {
  margin: 14px 0;
  background: #101014;
  border: 1px solid #292930;
  border-radius: 12px;
  overflow: hidden;
}

.code-header {
  height: 36px;
  padding: 0 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #18181e;
  color: #888;
  font-size: 11px;
}

.code-header button {
  width: auto;
  height: auto;
  padding: 5px 9px;
  border: 1px solid #33333b;
  border-radius: 7px;
  background: #24242b;
  color: #ccc;
  font-size: 11px;
  cursor: pointer;
}

.code-block pre {
  margin: 0;
  padding: 14px;
  overflow-x: auto;
}

.code-block code {
  font-family: monospace;
  font-size: 13px;
  line-height: 1.55;
}

.code-block .syntax-keyword {
  color: #c792ea;
}

.code-block .syntax-string {
  color: #c3e88d;
}

.code-block .syntax-number {
  color: #f78c6c;
}

.code-block .syntax-function {
  color: #82aaff;
}

.code-block .syntax-comment {
  color: #676e95;
  font-style: italic;
}

.code-block .syntax-boolean {
  color: #ffcb6b;
}

 .table-wrap {
  width: 100%;
  overflow-x: auto;
  margin: 10px 0 14px;
  border-radius: 10px;
}

.table-wrap table {
  width: 100%;
  min-width: 520px;
  border-collapse: collapse;
  font-size: 13px;
}

.table-wrap th,
.table-wrap td {
  border: 1px solid #3a3a44;
  padding: 9px 10px;
  text-align: left;
  vertical-align: top;
}

.table-wrap th {
  font-weight: 700;
}

/* Premium table */
.table-wrap {
  width: 100%;
  overflow-x: auto;
  overflow-y: hidden;
  margin: 10px 0 14px;
  border-radius: 12px;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}

.table-wrap::-webkit-scrollbar {
  display: none;
}

.table-wrap table {
  width: 820px;
  min-width: 820px;
  border-collapse: collapse;
  table-layout: fixed;
  font-size: 15px;
}

.table-wrap th:nth-child(1),
.table-wrap td:nth-child(1) {
  width: 190px;
}

.table-wrap th:nth-child(n+2),
.table-wrap td:nth-child(n+2) {
  width: 210px;
}

.table-wrap th,
.table-wrap td {
  border: 0;
  border-bottom: 1px solid #303038;
  padding: 12px 14px;
  text-align: left;
  vertical-align: top;
  line-height: 1.5;
}

.table-wrap th {
  font-weight: 700;
  white-space: nowrap;
  background: transparent;
}

.table-wrap td {
  white-space: normal;
  overflow-wrap: normal;
  word-break: normal;
}

@media (max-width: 600px) {
  header {
    height: 55px;
  }

  #chat {
    padding: 20px 12px 120px;
  }

  .welcome {
    min-height: 58vh;
  }

  .welcome h1 {
    font-size: 24px;
  }

  .message > div {
    max-width: 90%;
  }

  .input-area {
    padding-left: 10px;
    padding-right: 10px;
  }
}

/* TERMUX AI THEME SYSTEM V2 */

/* =========================
   CODE BLOCK
   ========================= */

}

/* Syntax highlighting - light */
html.light .syntax.keyword {
  color: #8250df !important;
}

html.light .syntax.string {
  color: #0a3069 !important;
}

html.light .syntax.number {
  color: #0550ae !important;
}

}

html.light .syntax.comment {

}

/* =========================
   TABLE
   ========================= */

}

}

/* =========================
   INPUT AREA
   ========================= */

  background: #f7f7f8 !important;

  border-color: #d8dee4 !important;
}

html.light textarea::placeholder,

\n</style>

<style id="termux-login-style">
#termux-login-screen {
  position: fixed;
  inset: 0;
  z-index: 999999;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  box-sizing: border-box;
  background: #0b0f14;
}

#termux-login-card {
  width: min(420px, 100%);
  padding: 32px 24px;
  box-sizing: border-box;
  border-radius: 22px;
  background: #151b23;
  box-shadow: 0 20px 60px rgba(0,0,0,.45);

#termux-login-title {
  text-align: center;
  font-size: 28px;
  font-weight: 800;
  margin-bottom: 8px;
}

#termux-login-subtitle {
  text-align: center;
  opacity: .7;
  margin-bottom: 28px;
}

  box-sizing: border-box;

</style>


<style id="termux-multi-chat-css">
/* TERMUX_MULTI_CHAT_STYLE_V2 */

#conversation-sidebar {
  position: fixed;
  top: 0;
  left: 0;
  bottom: 0;
  width: min(330px, 86vw);
  z-index: 10000;

  background: #0b0f14;
  color: #f3f4f6;

  border-right: 1px solid rgba(255,255,255,.10);

  align-items: center;

  padding: 0 16px;

  border-bottom: 1px solid rgba(255,255,255,.08);

#conversation-sidebar-title {
  color: #f5f7fa;
  font-size: 17px;
  font-weight: 650;
  letter-spacing: -.2px;
}

#conversation-close-button {
  width: 38px;
  height: 38px;

  border: 0;
  border-radius: 10px;

  background: transparent;
  color: #e5e7eb;

  font-size: 27px;
  line-height: 1;

  cursor: pointer;

  display: flex;
  align-items: center;
  justify-content: center;

#conversation-close-button:hover {

#new-conversation-button {

  background: #171c23;

  font-size: 15px;
  font-weight: 550;

  cursor: pointer;

  transition: background .15s ease, border-color .15s ease;

#new-conversation-button:hover {

  text-align: left;

.conversation-item:hover {

<style id="termux-multi-chat-style-v5">

/* =========================================================
   TERMUX AI — MULTI CHAT DRAWER
   ========================================================= */

/* ---------- Header ---------- */

header {
  display: flex;
  align-items: center;
  gap: 8px;
}

header .brand {
  flex: 1;
  min-width: 0;
}

#conversation-history-button {
  order: -1;

  width: 42px;
  height: 42px;
  min-width: 42px;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 0;
  margin: 0;

  border: 0;
  border-radius: 10px;

  background: transparent;
  color: inherit;

  font-size: 24px;
  line-height: 1;

  cursor: pointer;
}

#conversation-history-button:hover {
  background: rgba(255,255,255,.08);
}

#new-conversation-header-button {
  display: none !important;
}


/* ---------- Overlay ---------- */

#conversation-overlay {
  position: fixed;
  inset: 0;

  z-index: 998;

  background: rgba(0,0,0,.55);

  opacity: 0;
  visibility: hidden;
  pointer-events: none;

  transition:
    opacity .22s ease,
    visibility .22s ease;
}

#conversation-overlay.open,
#conversation-overlay.show,
#conversation-overlay.active {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
}


/* ---------- Sidebar ---------- */

#conversation-sidebar {
  position: fixed;

  top: 0;
  left: 0;
  bottom: 0;

  z-index: 999;

  width: min(320px, 86vw);

  box-sizing: border-box;

  display: flex;
  flex-direction: column;

  background: #0b0f14;
  color: #f5f7fa;

  border-right: 1px solid rgba(255,255,255,.10);

  box-shadow: 18px 0 45px rgba(0,0,0,.28);

  transform: translateX(-105%);
  visibility: hidden;

  transition:
    transform .24s cubic-bezier(.22,.61,.36,1),
    visibility .24s ease;
}

#conversation-sidebar.open {
  transform: translateX(0);
  visibility: visible;
}


/* ---------- Sidebar header ---------- */

#conversation-sidebar-header {
  height: 64px;
  min-height: 64px;

  box-sizing: border-box;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 0 14px 0 18px;

  border-bottom: 1px solid rgba(255,255,255,.08);

  background: #0b0f14;
}

#conversation-sidebar-title {
  color: #ffffff !important;

  font-size: 17px;
  font-weight: 650;
}

#conversation-close-button {
  width: 40px;
  height: 40px;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 0;
  margin: 0;

  border: 0;
  border-radius: 10px;

  background: transparent;
  color: #ffffff;

  font-size: 27px;
  line-height: 1;

  cursor: pointer;
}

#conversation-close-button:hover {
  background: rgba(255,255,255,.08);
}


/* ---------- New chat ---------- */

#new-conversation-button {
  margin: 14px 12px 10px;

  min-height: 46px;

  box-sizing: border-box;

  border: 1px solid rgba(255,255,255,.10);
  border-radius: 12px;

  background: #171c23;
  color: #ffffff;

  font-size: 15px;
  font-weight: 600;

  cursor: pointer;

  transition:
    background .15s ease,
    border-color .15s ease,
    transform .1s ease;
}

#new-conversation-button:hover {
  background: #222933;
  border-color: rgba(255,255,255,.16);
}

#new-conversation-button:active {
  transform: scale(.98);
}


/* ---------- Conversation list ---------- */

#conversation-list {
  flex: 1;

  overflow-y: auto;

  padding: 4px 9px 18px;

  scrollbar-width: thin;
}

.conversation-item {
  width: 100%;

  display: flex;
  align-items: center;

  box-sizing: border-box;

  padding: 12px 13px;
  margin-bottom: 5px;

  border: 1px solid transparent;
  border-radius: 11px;

  background: transparent;
  color: #e5e7eb;

  cursor: pointer;

  text-align: left;
  font: inherit;

  transition:
    background .15s ease,
    color .15s ease;
}

.conversation-item:hover {
  background: rgba(255,255,255,.065);
  color: #ffffff;
}

.conversation-item.active {
  background: rgba(255,255,255,.105);
  color: #ffffff;

  border-color: rgba(255,255,255,.06);
}

.conversation-item-title {
  color: inherit !important;

  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}


/* ---------- Mobile ---------- */

@media (max-width: 600px) {

  #conversation-sidebar {
    width: min(310px, 86vw);
  }

  #conversation-history-button {
    width: 40px;
    height: 40px;
    min-width: 40px;

    font-size: 23px;
  }

}

<script>
const chat = document.getElementById("chat");
const inner = document.querySelector(".chat-inner");
const input = document.getElementById("message");
const send = document.getElementById("send");

// TERMUX_MULTI_CHAT_FINAL

const CONVERSATIONS_KEY = "termux_ai_conversations";
const ACTIVE_CONVERSATION_KEY = "termux_ai_active_conversation";
const LEGACY_CONVERSATION_KEY = "termux_ai_conversation";

let conversations = {};
let activeConversationId = "";
let conversationHistory = [];

function makeConversationId() {
  return "chat_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8);
}

function saveAllConversations() {
  try {
    localStorage.setItem(
      CONVERSATIONS_KEY,
      JSON.stringify(conversations)
    );

    localStorage.setItem(
      ACTIVE_CONVERSATION_KEY,
      activeConversationId
    );
  } catch (error) {
    console.warn("Gagal menyimpan riwayat:", error);
  }
}

function migrateOldConversation() {
  if (Object.keys(conversations).length !== 0) return;

  const oldSaved = localStorage.getItem(LEGACY_CONVERSATION_KEY);

  if (!oldSaved) return;

  try {
    const oldHistory = JSON.parse(oldSaved);

    if (!Array.isArray(oldHistory) || oldHistory.length === 0) {
      return;
    }

    const id = makeConversationId();

    conversations[id] = {
      id,
      title: String(oldHistory[0]?.content || "Percakapan lama")
        .replace(/\\s+/g, " ")
        .trim()
        .slice(0, 60) || "Percakapan lama",
      messages: oldHistory.slice(-30),
      updatedAt: Date.now()
    };

    activeConversationId = id;
    saveAllConversations();
  } catch (error) {
    console.warn("Migrasi percakapan lama gagal:", error);
  }
}

function createNewConversation() {
  const id = makeConversationId();

  conversations[id] = {
    id,
    title: "Obrolan baru",
    messages: [],
    updatedAt: Date.now()
  };

  activeConversationId = id;
  conversationHistory = [];

  saveAllConversations();
}

function loadConversationHistory() {
  try {
    const saved = localStorage.getItem(CONVERSATIONS_KEY);

    if (saved) {
      const data = JSON.parse(saved);

      if (data && typeof data === "object" && !Array.isArray(data)) {
        conversations = data;
      }
    }
  } catch (error) {
    console.warn("Gagal membaca riwayat:", error);
    conversations = {};
  }

  migrateOldConversation();

  const savedActive =
    localStorage.getItem(ACTIVE_CONVERSATION_KEY);

  if (
    savedActive &&
    conversations[savedActive]
  ) {
    activeConversationId = savedActive;
  }

  if (!activeConversationId) {
    const ids = Object.keys(conversations);

    if (ids.length) {
      ids.sort(
        (a, b) =>
          (conversations[b].updatedAt || 0) -
          (conversations[a].updatedAt || 0)
      );

      activeConversationId = ids[0];
    }
  }

  if (!activeConversationId) {
    createNewConversation();
  }

  const current = conversations[activeConversationId];

  conversationHistory = Array.isArray(current?.messages)
    ? current.messages.slice(-30)
    : [];
}

function saveCurrentConversation() {
  const current = conversations[activeConversationId];

  if (!current) return;

  current.messages = conversationHistory.slice(-30);
  current.updatedAt = Date.now();

  if (
    current.title === "Obrolan baru" &&
    conversationHistory.length
  ) {
    const firstUser = conversationHistory.find(
      item =>
        item.role === "user" &&
        typeof item.content === "string" &&
        item.content.trim()
    );

    if (firstUser) {
      current.title = firstUser.content
        .replace(/\\s+/g, " ")
        .trim()
        .slice(0, 60);
    }
  }

  saveAllConversations();
  renderConversationList();
}

function rememberUserMessage(text) {
  if (!text) return;

  conversationHistory.push({
    role: "user",
    content: text
  });

  conversationHistory = conversationHistory.slice(-30);
  saveCurrentConversation();
}

function rememberAIMessage(text) {
  if (!text) return;

  conversationHistory.push({
    role: "assistant",
    content: text
  });

  conversationHistory = conversationHistory.slice(-30);
  saveCurrentConversation();
}

function restoreConversationUI() {
  if (!conversationHistory.length) return;

  const welcome = document.getElementById("welcome");

  if (welcome) {
    welcome.remove();
  }

  for (const item of conversationHistory) {
    if (item.role === "assistant") {
      const box = document.createElement("div");
      box.className = "message ai";

      const content = document.createElement("div");

      const label = document.createElement("div");
      label.className = "label";
      label.textContent = "AI";

      const textElement = document.createElement("div");
      textElement.className = "markdown";
      textElement.innerHTML = renderMarkdown(item.content);

      content.appendChild(label);
      content.appendChild(textElement);
      box.appendChild(content);
      inner.appendChild(box);
    } else {
      addMessage("user", item.content);
    }
  }

  chat.scrollTop = chat.scrollHeight;
}

function renderConversationList() {
  const list = document.getElementById("conversation-list");

  if (!list) return;

  list.innerHTML = "";

  const ids = Object.keys(conversations);

  ids.sort(
    (a, b) =>
      (conversations[b].updatedAt || 0) -
      (conversations[a].updatedAt || 0)
  );

  if (!ids.length) {
    list.innerHTML =
      '<div class="conversation-empty">Belum ada percakapan.</div>';
    return;
  }

  for (const id of ids) {
    const data = conversations[id];

    const item = document.createElement("button");
    item.type = "button";
    item.className =
      "conversation-item" +
      (id === activeConversationId ? " active" : "");

    const title = document.createElement("span");
    title.className = "conversation-item-title";
    title.textContent = data.title || "Obrolan baru";

    item.appendChild(title);

    let longPressTimer = null;
    let longPressTriggered = false;

    function cancelLongPress() {
      if (longPressTimer) {
        clearTimeout(longPressTimer);
        longPressTimer = null;
      }
    }

    function startLongPress() {
      cancelLongPress();
      longPressTriggered = false;

      longPressTimer = setTimeout(() => {
        longPressTimer = null;
        longPressTriggered = true;

        deleteConversation(id);
      }, 650);
    }

    item.addEventListener("pointerdown", startLongPress);
    item.addEventListener("pointerup", cancelLongPress);
    item.addEventListener("pointerleave", cancelLongPress);
    item.addEventListener("pointercancel", cancelLongPress);
    item.addEventListener("pointermove", cancelLongPress);

    item.onclick = function(event) {
      if (longPressTriggered) {
        event.preventDefault();
        longPressTriggered = false;
        return;
      }

      activeConversationId = id;
      saveAllConversations();
      location.reload();
    };

    list.appendChild(item);
  }
}


function deleteConversation(id) {
  if (!id || !conversations[id]) return;

  delete conversations[id];

  if (activeConversationId === id) {
    const remainingIds = Object.keys(conversations);

    if (remainingIds.length) {
      remainingIds.sort(
        (a, b) =>
          (conversations[b].updatedAt || 0) -
          (conversations[a].updatedAt || 0)
      );

      activeConversationId = remainingIds[0];

      conversationHistory = Array.isArray(
        conversations[activeConversationId]?.messages
      )
        ? conversations[activeConversationId].messages.slice(-30)
        : [];
    } else {
      createNewConversation();
    }
  }

  saveAllConversations();
  renderConversationList();
}

function openConversationHistory() {
  const sidebar =
    document.getElementById("conversation-sidebar");

  const overlay =
    document.getElementById("conversation-overlay");

  sidebar?.classList.add("open");
  overlay?.classList.add("open");

  renderConversationList();
}

function closeConversationHistory() {
  document
    .getElementById("conversation-sidebar")
    ?.classList.remove("open");

  document
    .getElementById("conversation-overlay")
    ?.classList.remove("open");
}

function startNewConversation() {
  createNewConversation();
  location.reload();
}

loadConversationHistory();

setTimeout(restoreConversationUI, 0);

setTimeout(renderConversationList, 0);



function addMessage(type, text, images = []) {
  const welcome = document.getElementById("welcome");

  if (welcome) {
    welcome.remove();
  }

  const box = document.createElement("div");
  box.className = "message " + type;

  const content = document.createElement("div");

  const label = document.createElement("div");
  label.className = "label";
  label.textContent = type === "user" ? "Kamu" : "AI";

  const textElement = document.createElement("span");
  textElement.textContent = text;

  content.appendChild(label);
  content.appendChild(textElement);

  if (type === "user" && images.length) {
    const imageWrap = document.createElement("div");
    imageWrap.className = "message-images";
    images.forEach(image => {
      const img = document.createElement("img");
      img.src = image.dataUrl;
      img.alt = image.name || "Gambar";
      imageWrap.appendChild(img);
    });
    content.appendChild(imageWrap);
  }

  box.appendChild(content);
  inner.appendChild(box);

  chat.scrollTop = chat.scrollHeight;

  return box;
}

function escapeHTML(text) {
  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function renderInline(text) {
  let html = escapeHTML(text);

  html = html.replace(/`([^`]+)`/g,
    '<code class="inline-code">$1</code>'
  );

  html = html.replace(/\*\*([^*]+)\*\*/g,
    "<strong>$1</strong>"
  );

  html = html.replace(/\*([^*]+)\*/g,
    "<em>$1</em>"
  );

  return html;
}

function highlightCode(code, language) {
  const lang = String(language || "").toLowerCase();

  const jsLike =
    lang.includes("javascript") ||
    lang === "js" ||
    lang.includes("typescript") ||
    lang === "ts";

  const isJson = lang === "json";
  const isPython = lang === "python" || lang === "py";
  const isShell =
    lang === "bash" ||
    lang === "sh" ||
    lang === "shell" ||
    lang === "zsh";
  const isHtml =
    lang === "html" ||
    lang === "xml";
  const isCss =
    lang === "css" ||
    lang === "scss";

  const keywords = new Set();

  if (jsLike) {
    [
      "const","let","var","function","return","if","else","for","while",
      "do","new","class","extends","import","export","from","async",
      "await","try","catch","throw","typeof","instanceof","switch",
      "case","break","continue","this"
    ].forEach(x => keywords.add(x));
  }

  if (isPython) {
    [
      "def","return","if","elif","else","for","while","in","import",
      "from","as","class","try","except","raise","with","lambda",
      "yield","async","await","pass","break","continue"
    ].forEach(x => keywords.add(x));
  }

  if (isShell) {
    [
      "if","then","else","elif","fi","for","in","do","done",
      "case","esac","function"
    ].forEach(x => keywords.add(x));
  }

  if (isJson) {
    return escapeHTML(code)
      .replace(/(&quot;[^&]*?&quot;)(\s*:)/g,
        '<span class="syntax-function">$1</span>$2'
      )
      .replace(/(&quot;(?:\\.|[^&])*?&quot;)/g,
        '<span class="syntax-string">$1</span>'
      )
      .replace(/\b(true|false|null)\b/g,
        '<span class="syntax-boolean">$1</span>'
      )
      .replace(/\b\d+(?:\.\d+)?\b/g,
        '<span class="syntax-number">$&</span>'
      );
  }

  if (isHtml) {
    let result = "";
    let last = 0;
    const tagRegex = /<\/?[A-Za-z][^>]*>/g;
    let m;

    while ((m = tagRegex.exec(code)) !== null) {
      result += escapeHTML(code.slice(last, m.index));
      result += '<span class="syntax-html-tag">' +
        escapeHTML(m[0]) +
        "</span>";
      last = tagRegex.lastIndex;
    }

    return result + escapeHTML(code.slice(last));
  }

  if (isCss) {
    const cssTokenRegex =
      /\/\*[\s\S]*?\*\/|#[0-9a-fA-F]{3,8}\b|\b\d+(?:\.\d+)?(?:px|rem|em|vh|vw|vmin|vmax|%|deg|s|ms)\b|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'/g;

    let result = "";
    let last = 0;
    let m;

    while ((m = cssTokenRegex.exec(code)) !== null) {
      result += escapeHTML(code.slice(last, m.index));

      const token = m[0];

      if (token.startsWith("/*")) {
        result += '<span class="syntax-comment">' +
          escapeHTML(token) +
          "</span>";
      } else if (
        token.startsWith('"') ||
        token.startsWith("'")
      ) {
        result += '<span class="syntax-string">' +
          escapeHTML(token) +
          "</span>";
      } else {
        result += '<span class="syntax-css-value">' +
          escapeHTML(token) +
          "</span>";
      }

      last = cssTokenRegex.lastIndex;
    }

    return result + escapeHTML(code.slice(last));
  }

  const tokenRegex =
    /(\/\/[^\n]*|#[^\n]*|<!--[\s\S]*?-->|\/(?:\\.|[^\/\\\n])+\/[gimsuy]*|@[A-Za-z_$][\w$-]*|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|\`(?:\\.|[^\`\\])*\`|\b\d+(?:\.\d+)?\b|===|!==|==|!=|=>|<=|>=|&&|\|\||\+\+|--|\+=|-=|\*=|\/=|%=|\*\*|[+\-*\/%=<>!&|?:~^]+|\b[A-Za-z_$][\w$-]*\b)/g;

  let result = "";
  let lastIndex = 0;
  let match;

  const builtins =
    /^(Math|JSON|Date|Object|Array|String|Number|Boolean|Promise|RegExp|Map|Set|Error|console)$/;

  const constants =
    /^(API_URL|API_KEY|BASE_URL|MODEL|MAX_RETRY|PORT|HOST)$/;

  const primitiveTypes =
    /^(string|number|boolean|void|unknown|never|any|object|undefined|null)$/;

  while ((match = tokenRegex.exec(code)) !== null) {
    result += escapeHTML(code.slice(lastIndex, match.index));

    const token = match[0];
    const escaped = escapeHTML(token);
    const before = code.slice(0, match.index);
    const after = code.slice(match.index + token.length);

    if (
      token.startsWith("//") ||
      (token.startsWith("#") && (isPython || isShell)) ||
      token.startsWith("<!--")
    ) {
      result += '<span class="syntax-comment">' + escaped + "</span>";

    } else if (token.startsWith("@")) {
      result += '<span class="syntax-decorator">' + escaped + "</span>";

    } else if (/^\/(?:\\.|[^\/\\\n])+\/[gimsuy]*$/.test(token)) {
      result += '<span class="syntax-regex">' + escaped + "</span>";

    } else if (/^(===|!==|==|!=|=>|<=|>=|&&|\|\||\+\+|--|\+=|-=|\*=|\/=|%=|\*\*|[+\-*\/%=<>!&|?:~^]+)$/.test(token)) {
      result += '<span class="syntax-operator">' + escaped + "</span>";

    } else if (
      token.startsWith('"') ||
      token.startsWith("'") ||
      token.startsWith("\`")
    ) {
      result += '<span class="syntax-string">' + escaped + "</span>";

    } else if (/^\d/.test(token)) {
      result += '<span class="syntax-number">' + escaped + "</span>";

    } else if (
      token === "true" ||
      token === "false" ||
      token === "null" ||
      (isPython && /^(True|False|None)$/.test(token))
    ) {
      result += '<span class="syntax-boolean">' + escaped + "</span>";

    } else if (/^(ERROR|INVALID|SyntaxError|syntax_error)$/.test(token)) {
      result += '<span class="syntax-error">' + escaped + "</span>";

    } else if (/^(WARN|WARNING|deprecated|DEPRECATED)$/.test(token)) {
      result += '<span class="syntax-warning">' + escaped + "</span>";

    } else if (keywords.has(token)) {
      result += '<span class="syntax-keyword">' + escaped + "</span>";

    } else if (builtins.test(token)) {
      result += '<span class="syntax-builtin">' + escaped + "</span>";

    } else if (
      /^(interface|type|enum)\s+$/.test(before.slice(-15)) ||
      primitiveTypes.test(token) ||
      /:\s*$/.test(before.slice(-80))
    ) {
      result += '<span class="syntax-type">' + escaped + "</span>";

    } else if (
      /\bclass\s+$/.test(before.slice(-80)) ||
      /\bnew\s+$/.test(before.slice(-80))
    ) {
      result += '<span class="syntax-class">' + escaped + "</span>";

    } else if (
      /\b(?:function|def)\s+[A-Za-z_$][\w$-]*\s*\([^)]*$/.test(before)
    ) {
      result += '<span class="syntax-parameter">' + escaped + "</span>";

    } else if (
      /^\s*\(/.test(after)
    ) {
      result += '<span class="syntax-function">' + escaped + "</span>";

    } else if (
      constants.test(token) ||
      /^[A-Z][A-Z0-9_]{2,}$/.test(token)
    ) {
      result += '<span class="syntax-constant">' + escaped + "</span>";

    } else if (
      /\b(const|let|var)\s+$/.test(before.slice(-80))
    ) {
      result += '<span class="syntax-variable">' + escaped + "</span>";

    } else if (
      /^\s*\./.test(code.slice(Math.max(0, match.index - 1), match.index + token.length))
    ) {
      result += '<span class="syntax-property">' + escaped + "</span>";

    } else {
      result += '<span class="syntax-identifier">' + escaped + "</span>";
    }

    lastIndex = tokenRegex.lastIndex;
  }

  result += escapeHTML(code.slice(lastIndex));

  return result;
}
function renderTable(rows) {
  if (!rows || rows.length < 2) return "";

  const parseRow = line =>
    line.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(cell => cell.trim());

  const headers = parseRow(rows[0]);
  const separator = parseRow(rows[1]);
  const isSeparator = separator.length === headers.length &&
    separator.every(cell => /^:?-{3,}:?$/.test(cell));

  if (!isSeparator) return "";

  const body = rows.slice(2).map(parseRow);
  let html = '<div class="table-wrap"><table><thead><tr>';
  headers.forEach(cell => { html += '<th>' + renderInline(cell) + '</th>'; });
  html += '</tr></thead><tbody>';

  body.forEach(cells => {
    if (!cells.some(Boolean)) return;
    html += '<tr>';
    headers.forEach((_, index) => {
      html += '<td>' + renderInline(cells[index] || '') + '</td>';
    });
    html += '</tr>';
  });

  html += '</tbody></table></div>';
  return html;
}

function renderMarkdown(text) {
  const lines = String(text).split("\n");

  let html = "";
  let inCode = false;
  let language = "";
  let code = [];
  let list = null;

  function closeList() {
    if (list) {
      html += "</" + list + ">";
      list = null;
    }
  }

  function closeCode() {
    const codeText = highlightCode(
      code.join("\n"),
      language
    );

    html +=
      '<div class="code-block">' +
        '<div class="code-header">' +
          "<span>" + escapeHTML(language || "code") + "</span>" +
          '<button type="button" onclick="copyCode(this)">Copy</button>' +
        "</div>" +
        "<pre><code>" + codeText + "</code></pre>" +
      "</div>";

    inCode = false;
    language = "";
    code = [];
  }

    for (let i = 0; i < lines.length; i += 1) {
      const line = lines[i];

    if (line.startsWith("```")) {
      if (inCode) {
        closeCode();
      } else {
        closeList();
        inCode = true;
        language = line.slice(3).trim();
        code = [];
      }
      continue;
    }

    if (inCode) {
      code.push(line);
      continue;
    }

    if (/^\s*\|.*\|\s*$/.test(line) && i + 1 < lines.length &&
        /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(lines[i + 1])) {
      closeList();
      const tableRows = [line];
      let j = i + 1;
      while (j < lines.length && /^\s*\|.*\|\s*$/.test(lines[j])) {
        tableRows.push(lines[j]);
        j += 1;
      }
      const tableHtml = renderTable(tableRows);
      if (tableHtml) {
        html += tableHtml;
        i = j - 1;
        continue;
      }
    }

    if (line.startsWith("### ")) {
      closeList();
      html += "<h3>" + renderInline(line.slice(4)) + "</h3>";
      continue;
    }

    if (line.startsWith("## ")) {
      closeList();
      html += "<h2>" + renderInline(line.slice(3)) + "</h2>";
      continue;
    }

    if (line.startsWith("# ")) {
      closeList();
      html += "<h1>" + renderInline(line.slice(2)) + "</h1>";
      continue;
    }

    if (/^[-*] /.test(line)) {
      if (list !== "ul") {
        closeList();
        html += "<ul>";
        list = "ul";
      }

      html += "<li>" + renderInline(line.slice(2)) + "</li>";
      continue;
    }

    if (/^\d+\. /.test(line)) {
      if (list !== "ol") {
        closeList();
        html += "<ol>";
        list = "ol";
      }

      html +=
        "<li>" +
        renderInline(line.replace(/^\d+\. /, "")) +
        "</li>";

      continue;
    }

    closeList();

    if (line.trim() !== "") {
      html += "<p>" + renderInline(line) + "</p>";
    }
  }

  closeList();

  if (inCode) {
    closeCode();
  }

  return html;
}

function copyCode(button) {
  const block = button.closest(".code-block");

  if (!block) return;

  const code = block.querySelector("code").innerText;

  navigator.clipboard.writeText(code).then(function() {
    const oldText = button.textContent;

    button.textContent = "Copied ✓";

    setTimeout(function() {
      button.textContent = oldText;
    }, 1500);
  });
}

async function typeAIMessage(text) {
  const welcome = document.getElementById("welcome");

  if (welcome) {
    welcome.remove();
  }

  const box = document.createElement("div");
  box.className = "message ai";

  const content = document.createElement("div");

  const label = document.createElement("div");
  label.className = "label";
  label.textContent = "AI";

  const textElement = document.createElement("div");
  textElement.className = "markdown";

  content.appendChild(label);
  content.appendChild(textElement);

  box.appendChild(content);
  inner.appendChild(box);

  for (let i = 0; i < text.length; i++) {
    textElement.textContent += text[i];

    if (i % 2 === 0) {
      chat.scrollTop = chat.scrollHeight;
    }

    await new Promise(function(resolve) {
      setTimeout(resolve, 8);
    });
  }

  textElement.innerHTML = renderMarkdown(text);
  chat.scrollTop = chat.scrollHeight;
}

function addTyping() {
  const welcome = document.getElementById("welcome");

  if (welcome) {
    welcome.remove();
  }

  const box = document.createElement("div");
  box.className = "message ai";

  const content = document.createElement("div");

  const label = document.createElement("div");
  label.className = "label";
  label.textContent = "AI";

  const typing = document.createElement("div");
  typing.className = "typing";

  typing.innerHTML =
    "<span></span><span></span><span></span>";

  content.appendChild(label);
  content.appendChild(typing);

  box.appendChild(content);
  inner.appendChild(box);

  return box;

const attach = document.getElementById("attach");
const imageInput = document.getElementById("image-input");
const attachmentRow = document.getElementById("attachment-row");
let pendingImages = [];

function renderAttachments() {
  attachmentRow.innerHTML = "";
  attachmentRow.classList.toggle("visible", pendingImages.length > 0);
  pendingImages.forEach((image, index) => {
    const item = document.createElement("div"); item.className = "attachment";
    const img = document.createElement("img"); img.src = image.dataUrl; img.alt = image.name || "Gambar";
    const remove = document.createElement("button"); remove.type = "button"; remove.textContent = "×";
    remove.onclick = () => { pendingImages.splice(index, 1); renderAttachments(); };
    item.appendChild(img); item.appendChild(remove); attachmentRow.appendChild(item);
  });
}

function readImage(file) {
  return new Promise((resolve, reject) => {
    if (!/^image\/(png|jpe?g|webp|gif)$/i.test(file.type)) return reject(new Error("Format gambar tidak didukung."));
    if (file.size > 8 * 1024 * 1024) return reject(new Error("Ukuran gambar maksimal 8 MB."));
    const reader = new FileReader();
    reader.onload = () => resolve({ name: file.name, type: file.type, dataUrl: String(reader.result) });
    reader.onerror = () => reject(new Error("Gagal membaca gambar."));
    reader.readAsDataURL(file);
  });
}

attach.onclick = () => imageInput.click();
imageInput.onchange = async () => {
  try {
    const files = Array.from(imageInput.files || []).slice(0, 4 - pendingImages.length);
    for (const file of files) pendingImages.push(await readImage(file));
    renderAttachments();
  } catch (error) { alert(error.message || "Gambar gagal dibaca."); }
  finally { imageInput.value = ""; }
};

async function sendMessage() {
  const text = input.value.trim();

  if ((!text && pendingImages.length === 0) || send.disabled) {
    return;
  }

  const imagesForMessage = pendingImages.slice();
  addMessage("user", text, imagesForMessage);

  input.value = "";
  pendingImages = [];
  renderAttachments();
  input.style.height = "auto";
  send.disabled = true;

  rememberUserMessage(text);

  const typing = addTyping();

  let aiBox = null;
  let aiText = null;
  let fullResponse = "";

  // Antrian tampilan agar jawaban selalu terlihat mengetik
  // dengan rendering yang lebih halus dan ringan.
  // Streaming ringan: token tidak dipecah menjadi karakter.
  // Token yang tiba dalam satu frame digabung dan dirender sekali.
  let displayQueue = [];
  let displayText = "";
  let typingResolve;
  let typingPromise = new Promise(resolve => {
    typingResolve = resolve;
  });
  let renderScheduled = false;

  function scheduleDisplay() {
    if (renderScheduled) {
      return;
    }

    renderScheduled = true;

    requestAnimationFrame(() => {
      renderScheduled = false;

      if (displayQueue.length > 0) {
        displayText += displayQueue.join("");
        displayQueue = [];

        if (aiText) {
          aiText.innerHTML = renderMarkdown(displayText);
        }

        chat.scrollTop = chat.scrollHeight;
      }

      if (displayQueue.length > 0) {
        scheduleDisplay();
      } else if (typingResolve) {
        const resolve = typingResolve;
        typingResolve = null;
        resolve();
      }
    });
  }

  function enqueueText(text) {
    if (!text) {
      return;
    }

    displayQueue.push(text);
    scheduleDisplay();

    return typingPromise;
  }

  try {
    const response = await TermuxAIAuth.fetch("/api/chat/stream", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: text,
        images: imagesForMessage.map(image => ({ name: image.name, type: image.type, dataUrl: image.dataUrl })),
        history: conversationHistory
      })
    });

    if (!response.ok) {
      let data = {};

      try {
        data = await response.json();
      } catch {}

      if (typing && typing.parentNode) {
        typing.remove();
      }

      addMessage(
        "ai",
        "⚠️ " + (data.error || "Terjadi error.")
      );

      return;
    }

    if (!response.body) {
      throw new Error(
        "Browser tidak mendukung streaming response."
      );
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder();

    let buffer = "";

    aiBox = document.createElement("div");
    aiBox.className = "message ai";

    const content = document.createElement("div");

    const label = document.createElement("div");
    label.className = "label";
    label.textContent = "AI";

    aiText = document.createElement("div");
    aiText.className = "markdown";

    content.appendChild(label);
    content.appendChild(aiText);

    aiBox.appendChild(content);
    inner.appendChild(aiBox);

    function processEvent(rawEvent) {
      const lines = rawEvent.split(/\r?\n/);

      let eventName = "message";
      let dataText = "";

      for (const line of lines) {
        if (line.startsWith("event:")) {
          eventName = line.slice(6).trim();
        }

        if (line.startsWith("data:")) {
          dataText += line.slice(5).trim();
        }
      }

      if (!dataText) {
        return;
      }

      let data;

      try {
        data = JSON.parse(dataText);
      } catch {
        return;
      }

      if (eventName === "token") {
        const token = data.content || "";

        // Hentikan loading saat token pertama benar-benar diterima.
        if (typing && typing.parentNode) {
          typing.remove();
        }

        fullResponse += token;
        enqueueText(token);
      }

      if (eventName === "done") {
        // Fallback untuk provider/project yang langsung mengirim
        // seluruh jawaban melalui event done.
        if (!fullResponse && data.response) {
          fullResponse = data.response;

          if (typing && typing.parentNode) {
            typing.remove();
          }

          enqueueText(data.response);
        }
      }

      if (eventName === "error") {
        throw new Error(
          data.error || "Streaming error."
        );
      }
    }

    while (true) {
      const { value, done } = await reader.read();

      if (done) {
        break;
      }

      buffer += decoder.decode(value, {
        stream: true
      });

      const events = buffer.split(/\r?\n\r?\n/);

      buffer = events.pop() || "";

      for (const event of events) {
        processEvent(event);
      }
    }

    if (buffer.trim()) {
      processEvent(buffer);
    }

    // Tunggu antrean tampilan selesai sebelum melakukan final render.
    // Ini menjaga efek streaming tetap berurutan ketika Android/WebView
    // menerima beberapa token sekaligus atau seluruh response dalam satu read.
    // Ada timeout pengaman agar UI tidak pernah macet jika requestAnimationFrame
    // berhenti berjalan.
    if (displayQueue.length > 0) {
      await Promise.race([
        typingPromise,
        new Promise(resolve => setTimeout(resolve, 8000))
      ]);
    }

    // Sumber kebenaran akhir tetap fullResponse, tetapi baru dirender setelah
    // antrean selesai ditampilkan agar jawaban tidak muncul mendadak sekaligus.
    if (aiText) {
      aiText.innerHTML = renderMarkdown(fullResponse);
    }

    rememberAIMessage(fullResponse);

    if (typing && typing.parentNode) {
      typing.remove();
    }

    chat.scrollTop = chat.scrollHeight;

  } catch (error) {
    console.error("STREAM ERROR:", error);

    if (typing && typing.parentNode) {
      typing.remove();
    }

    if (aiBox && aiBox.parentNode) {
      aiBox.remove();
    }

    addMessage(
      "ai",
      "⚠️ Streaming gagal: " +
      (error.message || "Terjadi kesalahan.")
    );

  } finally {
    send.disabled = false;
    input.focus();
  }
}

send.onclick = sendMessage;

input.addEventListener("keydown", function(event) {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});

input.addEventListener("input", function() {
  input.style.height = "auto";
  input.style.height =
    Math.min(input.scrollHeight, 120) + "px";
});

input.focus();

const exportButton = document.getElementById('export-conversation');

if (exportButton) {
  exportButton.addEventListener('click', async () => {
    exportButton.disabled = true;

    try {
      const response = await fetch('/api/conversation/export');
      if (!response.ok) throw new Error('Export gagal HTTP ' + response.status);

      const blob = await response.blob();
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'termux-ai-conversation-' + new Date().toISOString().slice(0, 10) + '.json';
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    } catch (error) {
      alert('Export conversation gagal: ' + error.message);
    } finally {
      exportButton.disabled = false;
    }
  });
}

<script id="termux-auth-script">
(function () {

  const STORAGE_KEY = "termux_ai_api_key";

  function getKey() {
    try {
      return localStorage.getItem(STORAGE_KEY) || "";
    } catch (error) {
      return "";
    }
  }

  function saveKey(key) {
    try {
      localStorage.setItem(STORAGE_KEY, key);
    } catch (error) {
      console.error("Gagal menyimpan API key:", error);
    }
  }

  function showLogin() {
    document.body.classList.add("termux-logged-out");

    const screen = document.getElementById("termux-login-screen");

    if (screen) {
      screen.style.display = "flex";
    }

    const input = document.getElementById("termux-api-key");

    if (input) {
      input.value = "";

      setTimeout(function () {
        input.focus();
      }, 150);
    }
  }

  function showChat() {
    document.body.classList.remove("termux-logged-out");

    const screen = document.getElementById("termux-login-screen");

    if (screen) {
      screen.style.display = "none";
    }
  }

  async function login() {

    const input = document.getElementById("termux-api-key");
    const button = document.getElementById("termux-login-button");
    const error = document.getElementById("termux-login-error");

    const key = String(input?.value || "").trim();

    if (!key) {
      if (error) {
        error.textContent = "API Key wajib diisi.";
      }

      return;
    }

    if (button) {
      button.disabled = true;
      button.textContent = "MEMERIKSA...";
    }

    if (error) {
      error.textContent = "";
    }

    try {

      const response = await TermuxAIAuth.fetch("/api/chat", {
        method: "POST",

        headers: {
          "Content-Type": "application/json",
          "X-API-Key": key
        },

        body: JSON.stringify({
          message: "Tes koneksi API key. Balas singkat: OK."
        })
      });

      const data = await response.json().catch(function () {
        return {};
      });

      if (!response.ok) {
        throw new Error(
          data.error || "API Key tidak dapat digunakan."
        );
      }

      saveKey(key);
      showChat();

    } catch (e) {

      if (error) {
        error.textContent =
          e.message || "Login gagal.";
      }

    } finally {

      if (button) {
        button.disabled = false;
        button.textContent = "MASUK";
      }

    }
  }

  window.TermuxAIAuth = {

    getKey: getKey,

    saveKey: saveKey,

    logout: function () {
      localStorage.removeItem(STORAGE_KEY);
      showLogin();
    },

    fetch: function (url, options) {

      options = options || {};

      const headers = new Headers(
        options.headers || {}
      );

      const key = getKey();

      if (key) {
        headers.set("X-API-Key", key);
      }

      return window.fetch(url, {
        ...options,
        headers: headers
      });
    }
  };

  document.addEventListener("DOMContentLoaded", function () {

    const button =
      document.getElementById("termux-login-button");

    const input =
      document.getElementById("termux-api-key");

    if (button) {
      button.addEventListener("click", login);
    }

    if (input) {
      input.addEventListener("keydown", function (event) {

        if (event.key === "Enter") {
          event.preventDefault();
          login();
        }

      });
    }

    if (getKey()) {
      showChat();
    } else {
      showLogin();
    }

  });

})();

<script>
(function () {
  const root = document.documentElement;
  const button = document.getElementById("theme-toggle");

  if (!button) return;

  function applyTheme(theme) {
    const light = theme === "light";

    root.classList.toggle("light", light);

    button.innerHTML = light ? "<span>🌙</span>" : "<span>☀️</span>";
    button.title = light ? "Mode gelap" : "Mode terang";
    button.setAttribute(
      "aria-label",
      light ? "Mode gelap" : "Mode terang"
    );

    document
      .querySelector('meta[name="theme-color"]')
      ?.setAttribute("content", light ? "#ffffff" : "#0b0b0f");
  }

  const savedTheme = localStorage.getItem("termux_ai_theme") || "dark";
  applyTheme(savedTheme);

  button.addEventListener("click", function () {
    const nextTheme = root.classList.contains("light")
      ? "dark"
      : "light";

    localStorage.setItem("termux_ai_theme", nextTheme);
    applyTheme(nextTheme);
  });
})();
</script>
