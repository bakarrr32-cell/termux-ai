<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0b0f">
<title>Termux AI</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: #0b0b0f;
  color: #f5f5f5;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
}

body {
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

header {
  height: 58px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  border-bottom: 1px solid #27272e;
  background: rgba(11, 11, 15, 0.96);
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 16px;
  font-weight: 650;
}

.online {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #22c55e;
  box-shadow: 0 0 10px rgba(34, 197, 94, 0.45);
}

.header-button {
  width: 36px;
  height: 36px;
  border: 0;
  border-radius: 10px;
  background: transparent;
  color: #aaa;
  font-size: 20px;
}

#chat {
  flex: 1;
  overflow-y: auto;
  padding: 28px 15px 125px;
}

#chat::-webkit-scrollbar {
  width: 4px;
}

#chat::-webkit-scrollbar-thumb {
  background: #292930;
  border-radius: 10px;
}

.chat-inner {
  width: 100%;
  max-width: 820px;
  margin: auto;
}

.welcome {
  min-height: 58vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 20px;
}

.logo {
  width: 62px;
  height: 62px;
  border-radius: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #f5f5f5;
  color: #101014;
  font-size: 23px;
  font-weight: 800;
  box-shadow: 0 15px 45px rgba(255,255,255,0.08);
  margin-bottom: 20px;
}

.welcome h1 {
  margin: 0;
  font-size: 27px;
  letter-spacing: -0.7px;
}

.welcome p {
  margin: 9px 0 0;
  color: #888893;
  font-size: 14px;
}

.message {
  display: flex;
  margin: 23px 0;
  animation: appear 0.18s ease;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(5px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.message.user {
  justify-content: flex-end;
}

.message.ai {
  justify-content: flex-start;
}

.message > div {
  max-width: 84%;
}

.label {
  margin-bottom: 6px;
  color: #777782;
  font-size: 11px;
}

.message.user .label {
  text-align: right;
}

.message.user span {
  display: inline-block;
  padding: 12px 16px;
  background: #252a34;
  border-radius: 18px 18px 5px 18px;
  font-size: 15px;
  line-height: 1.5;
  white-space: pre-wrap;
  word-break: break-word;
}

.message.ai {
  color: #ededf0;
  font-size: 15px;
  line-height: 1.65;
  word-break: break-word;
}

.typing {
  display: inline-flex;
  gap: 5px;
  align-items: center;
  padding: 8px 0;
}

.typing span {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #888;
  animation: typing 1.2s infinite;
}

.typing span:nth-child(2) {
  animation-delay: 0.15s;
}

.typing span:nth-child(3) {
  animation-delay: 0.3s;
}

@keyframes typing {
  0%, 60%, 100% {
    opacity: 0.3;
    transform: translateY(0);
  }

  30% {
    opacity: 1;
    transform: translateY(-4px);
  }
}

.input-area {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 10px 13px 14px;
  background: linear-gradient(to top, #0b0b0f 65%, transparent);
}

.input-box {
  max-width: 820px;
  margin: auto;
  display: flex;
  align-items: flex-end;
  flex-wrap: wrap;
  gap: 8px;
  padding: 8px;
  background: #17171d;
  border: 1px solid #33333c;
  border-radius: 17px;
  box-shadow: 0 10px 35px rgba(0,0,0,0.3);
}

.attachment-row { width: 100%; display: none; gap: 8px; padding: 8px 10px 0; overflow-x: auto; }
.attachment-row.visible { display: flex; }
.attachment { position: relative; flex: 0 0 auto; width: 58px; height: 58px; border-radius: 10px; overflow: hidden; border: 1px solid #33333c; background: #17171c; }
.attachment img { width: 100%; height: 100%; object-fit: cover; display: block; }
.attachment button { position: absolute; right: 2px; top: 2px; width: 20px; height: 20px; border: 0; border-radius: 50%; background: rgba(0,0,0,.75); color: #fff; cursor: pointer; }
#attach { width: 40px; height: 40px; flex-shrink: 0; border: 0; border-radius: 12px; background: #24242b; color: #ddd; font-size: 20px; cursor: pointer; }
#image-input { display: none; }
.message.user .message-images { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.message.user .message-images img { max-width: 180px; max-height: 180px; border-radius: 12px; object-fit: cover; }

textarea {
  flex: 1;
  min-width: 0;
  resize: none;
  border: 0;
  outline: 0;
  background: transparent;
  color: #fff;
  font-family: inherit;
  font-size: 15px;
  line-height: 1.45;
  padding: 9px;
}

textarea::placeholder {
  color: #777782;
}

#send {
  width: 40px;
  height: 40px;
  flex-shrink: 0;
  border: 0;
  border-radius: 12px;
  background: #f5f5f5;
  color: #111;
  font-size: 21px;
  cursor: pointer;
  transition: transform 0.15s ease;
}

#send:active {
  transform: scale(0.92);
}

#send:disabled {
  opacity: 0.4;
}

.markdown {
  white-space: normal;
}

.markdown h1,
.markdown h2,
.markdown h3 {
  line-height: 1.3;
  margin: 18px 0 10px;
}

.markdown h1 {
  font-size: 24px;
}

.markdown h2 {
  font-size: 20px;
}

.markdown h3 {
  font-size: 17px;
}

.markdown p {
  margin: 10px 0;
}

.markdown ul,
.markdown ol {
  padding-left: 25px;
  margin: 10px 0;
}

.markdown li {
  margin: 5px 0;
}

.inline-code {
  background: #202027;
  border: 1px solid #303039;
  border-radius: 5px;
  padding: 2px 6px;
  font-family: monospace;
  font-size: 0.9em;
}

.code-block {
  margin: 14px 0;
  background: #101014;
  border: 1px solid #292930;
  border-radius: 12px;
  overflow: hidden;
}

.code-header {
  height: 36px;
  padding: 0 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #18181e;
  color: #888;
  font-size: 11px;
}

.code-header button {
  width: auto;
  height: auto;
  padding: 5px 9px;
  border: 1px solid #33333b;
  border-radius: 7px;
  background: #24242b;
  color: #ccc;
  font-size: 11px;
  cursor: pointer;
}

.code-block pre {
  margin: 0;
  padding: 14px;
  overflow-x: auto;
}

.code-block code {
  font-family: monospace;
  font-size: 13px;
  line-height: 1.55;
}

.code-block .syntax-keyword {
  color: #c792ea;
}

.code-block .syntax-string {
  color: #c3e88d;
}

.code-block .syntax-number {
  color: #f78c6c;
}

.code-block .syntax-function {
  color: #82aaff;
}

.code-block .syntax-comment {
  color: #676e95;
  font-style: italic;
}

.code-block .syntax-boolean {
  color: #ffcb6b;
}

 .table-wrap {
  width: 100%;
  overflow-x: auto;
  margin: 10px 0 14px;
  border-radius: 10px;
}

.table-wrap table {
  width: 100%;
  min-width: 520px;
  border-collapse: collapse;
  font-size: 13px;
}

.table-wrap th,
.table-wrap td {
  border: 1px solid #3a3a44;
  padding: 9px 10px;
  text-align: left;
  vertical-align: top;
}

.table-wrap th {
  font-weight: 700;
}

@media (max-width: 600px) {
  header {
    height: 55px;
  }

  #chat {
    padding: 20px 12px 120px;
  }

  .welcome {
    min-height: 58vh;
  }

  .welcome h1 {
    font-size: 24px;
  }

  .message > div {
    max-width: 90%;
  }

  .input-area {
    padding-left: 10px;
    padding-right: 10px;
  }
}
</style>

<style id="termux-login-style">
#termux-login-screen {
  position: fixed;
  inset: 0;
  z-index: 999999;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  box-sizing: border-box;
  background: #0b0f14;
}

#termux-login-card {
  width: min(420px, 100%);
  padding: 32px 24px;
  box-sizing: border-box;
  border-radius: 22px;
  background: #151b23;
  box-shadow: 0 20px 60px rgba(0,0,0,.45);

#termux-login-title {

<body class="termux-logged-out">

<div id="termux-login-screen">
  <div id="termux-login-card">

    <div id="termux-login-title">
      🤖 Termux AI
    </div>

    <div id="termux-login-subtitle">
      Masukkan API Key untuk mulai
    </div>

    <input
      id="termux-api-key"
      type="password"
      placeholder="API Key"
      autocomplete="off"
      spellcheck="false"
    >

    <button id="termux-login-button">
      MASUK
    </button>

    <div id="termux-login-error"></div>

  </div>
</div>


<header>
  <div class="brand">
    <span class="online"></span>
    Termux AI
  </div>

  <button id="export-conversation" class="header-button" type="button" title="Export conversation">⇩</button>
</header>

<main id="chat">
  <div class="chat-inner">

    <div class="welcome" id="welcome">
      <div class="logo">AI</div>
      <h1>Apa yang bisa kita kerjakan?</h1>
      <p>AI coding partner langsung dari Termux.</p>
    </div>

  </div>
</main>

<div class="input-area">
  <div class="input-box">

    <div class="attachment-row" id="attachment-row"></div>
    <input id="image-input" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple>
    <button id="attach" type="button" aria-label="Kirim gambar">📎</button>

    <textarea
      id="message"
      rows="1"
      placeholder="Tulis pesan..."
      autocomplete="off"
    ></textarea>

    <button id="send" type="button">↑</button>

  </div>
</div>

<script>
const chat = document.getElementById("chat");
const inner = document.querySelector(".chat-inner");
const input = document.getElementById("message");
const send = document.getElementById("send");

function addMessage(type, text, images = []) {
  const welcome = document.getElementById("welcome");

  if (welcome) {
    welcome.remove();
  }

  const box = document.createElement("div");
  box.className = "message " + type;

  const content = document.createElement("div");

  const label = document.createElement("div");
  label.className = "label";
  label.textContent = type === "user" ? "Kamu" : "AI";

  const textElement = document.createElement("span");
  textElement.textContent = text;

  content.appendChild(label);
  content.appendChild(textElement);

  if (type === "user" && images.length) {
    const imageWrap = document.createElement("div");
    imageWrap.className = "message-images";
    images.forEach(image => {
      const img = document.createElement("img");
      img.src = image.dataUrl;
      img.alt = image.name || "Gambar";
      imageWrap.appendChild(img);
    });
    content.appendChild(imageWrap);
  }

  box.appendChild(content);
  inner.appendChild(box);

  chat.scrollTop = chat.scrollHeight;

  return box;
}

function escapeHTML(text) {
  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function renderInline(text) {
  let html = escapeHTML(text);

  html = html.replace(/`([^`]+)`/g,
    '<code class="inline-code">$1</code>'
  );

  html = html.replace(/\*\*([^*]+)\*\*/g,
    "<strong>$1</strong>"
  );

  html = html.replace(/\*([^*]+)\*/g,
    "<em>$1</em>"
  );

  return html;
}

function highlightCode(code, language) {
  const lang = String(language || "").toLowerCase();

  const jsLike =
    lang.includes("javascript") ||
    lang === "js" ||
    lang.includes("typescript") ||
    lang === "ts";

  const isJson = lang === "json";
  const isPython = lang === "python" || lang === "py";
  const isShell =
    lang === "bash" ||
    lang === "sh" ||
    lang === "shell" ||
    lang === "zsh";
  const isHtml =
    lang === "html" ||
    lang === "xml";

  const keywords = new Set();

  if (jsLike) {
    [
      "const","let","var","function","return","if","else","for","while",
      "do","new","class","extends","import","export","from","async",
      "await","try","catch","throw","typeof","instanceof","switch",
      "case","break","continue","this"
    ].forEach(x => keywords.add(x));
  }

  if (isPython) {
    [
      "def","return","if","elif","else","for","while","in","import",
      "from","as","class","try","except","raise","with","lambda",
      "yield","async","await","pass","break","continue"
    ].forEach(x => keywords.add(x));
  }

  if (isShell) {
    [
      "if","then","else","elif","fi","for","in","do","done",
      "case","esac","function"
    ].forEach(x => keywords.add(x));
  }

  if (isJson) {
    return escapeHTML(code)
      .replace(/(&quot;[^&]*?&quot;)(\s*:)/g,
        '<span class="syntax-function">$1</span>$2'
      )
      .replace(/(&quot;(?:\\.|[^&])*?&quot;)/g,
        '<span class="syntax-string">$1</span>'
      )
      .replace(/\b(true|false|null)\b/g,
        '<span class="syntax-boolean">$1</span>'
      )
      .replace(/\b\d+(?:\.\d+)?\b/g,
        '<span class="syntax-number">$&</span>'
      );
  }

  const tokenRegex =
    /(\/\/[^\n]*|#[^\n]*|<!--[\s\S]*?-->|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|\`(?:\\.|[^\`\\])*\`|\b\d+(?:\.\d+)?\b|\b[A-Za-z_$][\w$-]*\b)/g;

  let result = "";
  let lastIndex = 0;
  let match;

  while ((match = tokenRegex.exec(code)) !== null) {
    result += escapeHTML(code.slice(lastIndex, match.index));

    const token = match[0];
    const escaped = escapeHTML(token);

    if (
      token.startsWith("//") ||
      (token.startsWith("#") && (isPython || isShell)) ||
      token.startsWith("<!--")
    ) {
      result += '<span class="syntax-comment">' + escaped + "</span>";
    } else if (
      token.startsWith('"') ||
      token.startsWith("'") ||
      token.startsWith("\`")
    ) {
      result += '<span class="syntax-string">' + escaped + "</span>";
    } else if (/^\d/.test(token)) {
      result += '<span class="syntax-number">' + escaped + "</span>";
    } else if (
      token === "true" ||
      token === "false" ||
      token === "null"
    ) {
      result += '<span class="syntax-boolean">' + escaped + "</span>";
    } else if (keywords.has(token)) {
      result += '<span class="syntax-keyword">' + escaped + "</span>";
    } else if (
      /^\s*\(/.test(code.slice(match.index + token.length))
    ) {
      result += '<span class="syntax-function">' + escaped + "</span>";
    } else if (isHtml && /^[A-Za-z][\w-]*$/.test(token)) {
      result += '<span class="syntax-function">' + escaped + "</span>";
    } else {
      result += escaped;
    }

    lastIndex = tokenRegex.lastIndex;
  }

  result += escapeHTML(code.slice(lastIndex));

  return result;
}
function renderTable(rows) {
  if (!rows || rows.length < 2) return "";

  const parseRow = line =>
    line.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(cell => cell.trim());

  const headers = parseRow(rows[0]);
  const separator = parseRow(rows[1]);
  const isSeparator = separator.length === headers.length &&
    separator.every(cell => /^:?-{3,}:?$/.test(cell));

  if (!isSeparator) return "";

  const body = rows.slice(2).map(parseRow);
  let html = '<div class="table-wrap"><table><thead><tr>';
  headers.forEach(cell => { html += '<th>' + renderInline(cell) + '</th>'; });
  html += '</tr></thead><tbody>';

  body.forEach(cells => {
    if (!cells.some(Boolean)) return;
    html += '<tr>';
    headers.forEach((_, index) => {
      html += '<td>' + renderInline(cells[index] || '') + '</td>';
    });
    html += '</tr>';
  });

  html += '</tbody></table></div>';
  return html;
}

function renderMarkdown(text) {
  const lines = String(text).split("\n");

  let html = "";
  let inCode = false;
  let language = "";
  let code = [];
  let list = null;

  function closeList() {
    if (list) {
      html += "</" + list + ">";
      list = null;
    }
  }

  function closeCode() {
    const codeText = highlightCode(
      code.join("\n"),
      language
    );

    html +=
      '<div class="code-block">' +
        '<div class="code-header">' +
          "<span>" + escapeHTML(language || "code") + "</span>" +
          '<button type="button" onclick="copyCode(this)">Copy</button>' +
        "</div>" +
        "<pre><code>" + codeText + "</code></pre>" +
      "</div>";

    inCode = false;
    language = "";
    code = [];
  }

    for (let i = 0; i < lines.length; i += 1) {
      const line = lines[i];

    if (line.startsWith("```")) {
      if (inCode) {
        closeCode();
      } else {
        closeList();
        inCode = true;
        language = line.slice(3).trim();
        code = [];
      }
      continue;
    }

    if (inCode) {
      code.push(line);
      continue;
    }

    if (/^\s*\|.*\|\s*$/.test(line) && i + 1 < lines.length &&
        /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(lines[i + 1])) {
      closeList();
      const tableRows = [line];
      let j = i + 1;
      while (j < lines.length && /^\s*\|.*\|\s*$/.test(lines[j])) {
        tableRows.push(lines[j]);
        j += 1;
      }
      const tableHtml = renderTable(tableRows);
      if (tableHtml) {
        html += tableHtml;
        i = j - 1;
        continue;
      }
    }

    if (line.startsWith("### ")) {
      closeList();
      html += "<h3>" + renderInline(line.slice(4)) + "</h3>";
      continue;
    }

    if (line.startsWith("## ")) {
      closeList();
      html += "<h2>" + renderInline(line.slice(3)) + "</h2>";
      continue;
    }

    if (line.startsWith("# ")) {
      closeList();
      html += "<h1>" + renderInline(line.slice(2)) + "</h1>";
      continue;
    }

    if (/^[-*] /.test(line)) {
      if (list !== "ul") {
        closeList();
        html += "<ul>";
        list = "ul";
      }

      html += "<li>" + renderInline(line.slice(2)) + "</li>";
      continue;
    }

    if (/^\d+\. /.test(line)) {
      if (list !== "ol") {
        closeList();
        html += "<ol>";
        list = "ol";
      }

      html +=
        "<li>" +
        renderInline(line.replace(/^\d+\. /, "")) +
        "</li>";

      continue;
    }

    closeList();

    if (line.trim() !== "") {
      html += "<p>" + renderInline(line) + "</p>";
    }
  }

  closeList();

  if (inCode) {
    closeCode();
  }

  return html;
}

function copyCode(button) {
  const block = button.closest(".code-block");

  if (!block) return;

  const code = block.querySelector("code").innerText;

  navigator.clipboard.writeText(code).then(function() {
    const oldText = button.textContent;

    button.textContent = "Copied ✓";

    setTimeout(function() {
      button.textContent = oldText;
    }, 1500);
  });
}

async function typeAIMessage(text) {
  const welcome = document.getElementById("welcome");

  if (welcome) {
    welcome.remove();
  }

  const box = document.createElement("div");
  box.className = "message ai";

  const content = document.createElement("div");

  const label = document.createElement("div");
  label.className = "label";
  label.textContent = "AI";

  const textElement = document.createElement("div");
  textElement.className = "markdown";

  content.appendChild(label);
  content.appendChild(textElement);

  box.appendChild(content);
  inner.appendChild(box);

  for (let i = 0; i < text.length; i++) {
    textElement.textContent += text[i];

    if (i % 2 === 0) {
      chat.scrollTop = chat.scrollHeight;
    }

    await new Promise(function(resolve) {
      setTimeout(resolve, 8);
    });
  }

  textElement.innerHTML = renderMarkdown(text);
  chat.scrollTop = chat.scrollHeight;
}

function addTyping() {
  const welcome = document.getElementById("welcome");

  if (welcome) {
    welcome.remove();
  }

  const box = document.createElement("div");
  box.className = "message ai";

  const content = document.createElement("div");

  const label = document.createElement("div");
  label.className = "label";
  label.textContent = "AI";

  const typing = document.createElement("div");
  typing.className = "typing";

  typing.innerHTML =
    "<span></span><span></span><span></span>";

  content.appendChild(label);
  content.appendChild(typing);

  box.appendChild(content);
  inner.appendChild(box);

  chat.scrollTop = chat.scrollHeight;

  return box;
}

const attach = document.getElementById("attach");
const imageInput = document.getElementById("image-input");
const attachmentRow = document.getElementById("attachment-row");
let pendingImages = [];

function renderAttachments() {
  attachmentRow.innerHTML = "";
  attachmentRow.classList.toggle("visible", pendingImages.length > 0);
  pendingImages.forEach((image, index) => {
    const item = document.createElement("div"); item.className = "attachment";
    const img = document.createElement("img"); img.src = image.dataUrl; img.alt = image.name || "Gambar";
    const remove = document.createElement("button"); remove.type = "button"; remove.textContent = "×";
    remove.onclick = () => { pendingImages.splice(index, 1); renderAttachments(); };
    item.appendChild(img); item.appendChild(remove); attachmentRow.appendChild(item);
  });
}

function readImage(file) {
  return new Promise((resolve, reject) => {
    if (!/^image\/(png|jpe?g|webp|gif)$/i.test(file.type)) return reject(new Error("Format gambar tidak didukung."));
    if (file.size > 8 * 1024 * 1024) return reject(new Error("Ukuran gambar maksimal 8 MB."));
    const reader = new FileReader();
    reader.onload = () => resolve({ name: file.name, type: file.type, dataUrl: String(reader.result) });
    reader.onerror = () => reject(new Error("Gagal membaca gambar."));
    reader.readAsDataURL(file);
  });
}

attach.onclick = () => imageInput.click();
imageInput.onchange = async () => {
  try {
    const files = Array.from(imageInput.files || []).slice(0, 4 - pendingImages.length);
    for (const file of files) pendingImages.push(await readImage(file));
    renderAttachments();
  } catch (error) { alert(error.message || "Gambar gagal dibaca."); }
  finally { imageInput.value = ""; }
};

async function sendMessage() {
  const text = input.value.trim();

  if ((!text && pendingImages.length === 0) || send.disabled) {
    return;
  }

  const imagesForMessage = pendingImages.slice();
  addMessage("user", text, imagesForMessage);

  input.value = "";
  pendingImages = [];
  renderAttachments();
  input.style.height = "auto";
  send.disabled = true;

  const typing = addTyping();

  let aiBox = null;
  let aiText = null;
  let fullResponse = "";

  // Antrian tampilan agar jawaban selalu terlihat mengetik
  // dengan rendering yang lebih halus dan ringan.
  // Streaming ringan: token tidak dipecah menjadi karakter.
  // Token yang tiba dalam satu frame digabung dan dirender sekali.
  let displayQueue = [];
  let displayText = "";
  let typingResolve;
  let typingPromise = new Promise(resolve => {
    typingResolve = resolve;
  });
  let renderScheduled = false;

  function scheduleDisplay() {
    if (renderScheduled) {
      return;
    }

    renderScheduled = true;

    requestAnimationFrame(() => {
      renderScheduled = false;

      if (displayQueue.length > 0) {
        displayText += displayQueue.join("");
        displayQueue = [];

        if (aiText) {
          aiText.innerHTML = renderMarkdown(displayText);
        }

        chat.scrollTop = chat.scrollHeight;
      }

      if (displayQueue.length > 0) {
        scheduleDisplay();
      } else if (typingResolve) {
        const resolve = typingResolve;
        typingResolve = null;
        resolve();
      }
    });
  }

  function enqueueText(text) {
    if (!text) {
      return;
    }

    displayQueue.push(text);
    scheduleDisplay();

    return typingPromise;
  }

  try {
    const response = await TermuxAIAuth.fetch("/api/chat/stream", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: text,
        images: imagesForMessage.map(image => ({ name: image.name, type: image.type, dataUrl: image.dataUrl }))
      })
    });

    if (!response.ok) {
      let data = {};

      try {
        data = await response.json();
      } catch {}

      if (typing && typing.parentNode) {
        typing.remove();
      }

      addMessage(
        "ai",
        "⚠️ " + (data.error || "Terjadi error.")
      );

      return;
    }

    if (!response.body) {
      throw new Error(
        "Browser tidak mendukung streaming response."
      );
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder();

    let buffer = "";

    aiBox = document.createElement("div");
    aiBox.className = "message ai";

    const content = document.createElement("div");

    const label = document.createElement("div");
    label.className = "label";
    label.textContent = "AI";

    aiText = document.createElement("div");
    aiText.className = "markdown";

    content.appendChild(label);
    content.appendChild(aiText);

    aiBox.appendChild(content);
    inner.appendChild(aiBox);

    function processEvent(rawEvent) {
      const lines = rawEvent.split(/\r?\n/);

      let eventName = "message";
      let dataText = "";

      for (const line of lines) {
        if (line.startsWith("event:")) {
          eventName = line.slice(6).trim();
        }

        if (line.startsWith("data:")) {
          dataText += line.slice(5).trim();
        }
      }

      if (!dataText) {
        return;
      }

      let data;

      try {
        data = JSON.parse(dataText);
      } catch {
        return;
      }

      if (eventName === "token") {
        const token = data.content || "";

        // Hentikan loading saat token pertama benar-benar diterima.
        if (typing && typing.parentNode) {
          typing.remove();
        }

        fullResponse += token;
        enqueueText(token);
      }

      if (eventName === "done") {
        // Fallback untuk provider/project yang langsung mengirim
        // seluruh jawaban melalui event done.
        if (!fullResponse && data.response) {
          fullResponse = data.response;

          if (typing && typing.parentNode) {
            typing.remove();
          }

          enqueueText(data.response);
        }
      }

      if (eventName === "error") {
        throw new Error(
          data.error || "Streaming error."
        );
      }
    }

    while (true) {
      const { value, done } = await reader.read();

      if (done) {
        break;
      }

      buffer += decoder.decode(value, {
        stream: true
      });

      const events = buffer.split(/\r?\n\r?\n/);

      buffer = events.pop() || "";

      for (const event of events) {
        processEvent(event);
      }
    }

    if (buffer.trim()) {
      processEvent(buffer);
    }

    // Tunggu antrean tampilan selesai sebelum melakukan final render.
    // Ini menjaga efek streaming tetap berurutan ketika Android/WebView
    // menerima beberapa token sekaligus atau seluruh response dalam satu read.
    // Ada timeout pengaman agar UI tidak pernah macet jika requestAnimationFrame
    // berhenti berjalan.
    if (displayQueue.length > 0) {
      await Promise.race([
        typingPromise,
        new Promise(resolve => setTimeout(resolve, 8000))
      ]);
    }

    // Sumber kebenaran akhir tetap fullResponse, tetapi baru dirender setelah
    // antrean selesai ditampilkan agar jawaban tidak muncul mendadak sekaligus.
    if (aiText) {
      aiText.innerHTML = renderMarkdown(fullResponse);
    }

    if (typing && typing.parentNode) {
      typing.remove();
    }

    chat.scrollTop = chat.scrollHeight;

  } catch (error) {
    console.error("STREAM ERROR:", error);

    if (typing && typing.parentNode) {
      typing.remove();
    }

    if (aiBox && aiBox.parentNode) {
      aiBox.remove();
    }

    addMessage(
      "ai",
      "⚠️ Streaming gagal: " +
      (error.message || "Terjadi kesalahan.")
    );

  } finally {
    send.disabled = false;
    input.focus();
  }
}

send.onclick = sendMessage;

input.addEventListener("keydown", function(event) {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});

input.addEventListener("input", function() {
  input.style.height = "auto";
  input.style.height =
    Math.min(input.scrollHeight, 120) + "px";
});

input.focus();

const exportButton = document.getElementById('export-conversation');

if (exportButton) {
  exportButton.addEventListener('click', async () => {
    exportButton.disabled = true;

    try {
      const response = await fetch('/api/conversation/export');
      if (!response.ok) throw new Error('Export gagal HTTP ' + response.status);

      const blob = await response.blob();
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'termux-ai-conversation-' + new Date().toISOString().slice(0, 10) + '.json';
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    } catch (error) {
      alert('Export conversation gagal: ' + error.message);
    } finally {
      exportButton.disabled = false;
    }
  });
}

</script>


<script id="termux-auth-script">
(function () {

  const STORAGE_KEY = "termux_ai_api_key";

  function getKey() {
    try {
      return localStorage.getItem(STORAGE_KEY) || "";
    } catch (error) {
      return "";
    }
  }

  function saveKey(key) {
    try {
      localStorage.setItem(STORAGE_KEY, key);
    } catch (error) {
      console.error("Gagal menyimpan API key:", error);
    }
  }

  function showLogin() {
    document.body.classList.add("termux-logged-out");

    const screen = document.getElementById("termux-login-screen");

    if (screen) {
      screen.style.display = "flex";
    }

    const input = document.getElementById("termux-api-key");

    if (input) {
      input.value = "";

      setTimeout(function () {
        input.focus();
      }, 150);
    }
  }

  function showChat() {
    document.body.classList.remove("termux-logged-out");

    const screen = document.getElementById("termux-login-screen");

    if (screen) {
      screen.style.display = "none";
    }
  }

  async function login() {

    const input = document.getElementById("termux-api-key");
    const button = document.getElementById("termux-login-button");
    const error = document.getElementById("termux-login-error");

    const key = String(input?.value || "").trim();

    if (!key) {
      if (error) {
        error.textContent = "API Key wajib diisi.";
      }

      return;
    }

    if (button) {
      button.disabled = true;
      button.textContent = "MEMERIKSA...";
    }

    if (error) {
      error.textContent = "";
    }

    try {

      const response = await TermuxAIAuth.fetch("/api/chat", {
        method: "POST",

        headers: {
          "Content-Type": "application/json",
          "X-API-Key": key
        },

        body: JSON.stringify({
          message: "Tes koneksi API key. Balas singkat: OK."
        })
      });

      const data = await response.json().catch(function () {
        return {};
      });

      if (!response.ok) {
        throw new Error(
          data.error || "API Key tidak dapat digunakan."
        );
      }

      saveKey(key);
      showChat();

    } catch (e) {

      if (error) {
        error.textContent =
          e.message || "Login gagal.";
      }

    } finally {

      if (button) {
        button.disabled = false;
        button.textContent = "MASUK";
      }

    }
  }

  window.TermuxAIAuth = {

    getKey: getKey,

    saveKey: saveKey,

    logout: function () {
      localStorage.removeItem(STORAGE_KEY);
      showLogin();
    },

    fetch: function (url, options) {

      options = options || {};

      const headers = new Headers(
        options.headers || {}
      );

      const key = getKey();

      if (key) {
        headers.set("X-API-Key", key);
      }

      return window.fetch(url, {
        ...options,
        headers: headers
      });
    }
  };

  document.addEventListener("DOMContentLoaded", function () {

    const button =
      document.getElementById("termux-login-button");

    const input =
      document.getElementById("termux-api-key");

    if (button) {
      button.addEventListener("click", login);
    }

    if (input) {
      input.addEventListener("keydown", function (event) {

        if (event.key === "Enter") {
          event.preventDefault();
          login();
        }

      });
    }

    if (getKey()) {
      showChat();
    } else {
      showLogin();
    }

  });

})();
</script>
